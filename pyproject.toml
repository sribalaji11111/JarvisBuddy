[project]
name = "jarvisbuddy"
version = "0.2.0"
description = "A cute, fully personal voice assistant for your Windows laptop"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
jarvisbuddy = "jarvisbuddy.__main__:main"
jarvisbuddy-mcp = "jarvisbuddy.mcp_server:main"

[tool.setuptools]
packages = ["jarvisbuddy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E731", "B023"]
