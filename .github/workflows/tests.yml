name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Only what the tests need: mic, speech and voice libraries are faked in the tests.
      - run: pip install anthropic "mcp>=1.20,<2" psutil send2trash pytest ruff
      - run: ruff check jarvisbuddy tests
      - run: python -m pytest -q
